# Builds Green Markdown and publishes a GitHub release (with the updater's
# latest.json). Trigger: push a tag like `v0.2.0` (see scripts/release.sh).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runners are arm64 (Apple Silicon); windows-latest is x64.
        # Both jobs upload to the same release and merge their entries into
        # one latest.json.
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Green Markdown v__VERSION__
          releaseBody: Installed apps update from Check for Updates… (the Green Markdown menu on macOS, Help on Windows).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Windows builds both an MSI and an NSIS installer; update via NSIS.
          updaterJsonPreferNsis: true
